name: CI

on:
  push:
    branches: [master]
  pull_request:

env:
  CARGO_TERM_COLOR: always
  XWIN_CACHE_DIR: ${{ github.workspace }}/.xwin-cache

jobs:
  ci:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc
          components: clippy

      - name: Install wine (for cross tests)
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends wine \
            || sudo apt-get install -y --no-install-recommends wine64
          echo "--- wine binaries on runner ---"
          ls -l /usr/bin/wine* 2>/dev/null || true
          ls -l /usr/lib/wine/ 2>/dev/null || true

      - name: Cache cargo registry, target dir, xwin SDK, and cargo-xwin binary
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            ~/.cargo/bin/cargo-xwin.exe
            target
            .xwin-cache
          key: xwin-${{ hashFiles('Cargo.lock') }}-v2
          restore-keys: xwin-

      - name: Install cargo-xwin
        run: |
          if ! command -v cargo-xwin >/dev/null 2>&1; then
            cargo install --locked cargo-xwin
          else
            echo "cargo-xwin restored from cache"
          fi

      - name: Clippy (cross)
        run: cargo xwin clippy --target x86_64-pc-windows-msvc --all-targets -- -D warnings

      - name: Test (cross, under wine)
        run: |
          WINE_BIN="$(command -v wine || command -v wine64 || true)"
          if [ -z "$WINE_BIN" ]; then
            for c in /usr/lib/wine/wine /usr/lib/wine/wine64; do
              [ -x "$c" ] && WINE_BIN="$c" && break
            done
          fi
          if [ -z "$WINE_BIN" ]; then
            echo "::error::no wine binary found on runner"
            exit 1
          fi
          echo "using wine runner: $WINE_BIN"
          CARGO_TARGET_X86_64_PC_WINDOWS_MSVC_RUNNER="$WINE_BIN" \
            cargo xwin test --target x86_64-pc-windows-msvc

      - name: Build (cross)
        run: cargo xwin build --locked --release --target x86_64-pc-windows-msvc

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: game_mode_switcher
          path: target/x86_64-pc-windows-msvc/release/game_mode_switcher.exe
          if-no-files-found: error
