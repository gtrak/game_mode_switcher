name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

env:
  CARGO_TERM_COLOR: always
  XWIN_CACHE_DIR: ${{ github.workspace }}/.xwin-cache

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc

      - name: Cache cargo registry, target dir, xwin SDK, and cargo-xwin binary
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            ~/.cargo/bin/cargo-xwin.exe
            target
            .xwin-cache
          key: xwin-${{ hashFiles('Cargo.lock') }}-v2
          restore-keys: xwin-

      - name: Install cargo-xwin
        run: |
          if ! command -v cargo-xwin >/dev/null 2>&1; then
            cargo install --locked cargo-xwin
          else
            echo "cargo-xwin restored from cache"
          fi

      - name: Build (cross)
        run: cargo xwin build --locked --release --target x86_64-pc-windows-msvc

      - name: Stage release assets
        run: |
          dir=game_mode_switcher-${{ github.ref_name }}
          mkdir "$dir"
          cp target/x86_64-pc-windows-msvc/release/game_mode_switcher.exe "$dir/"
          cp README.md LICENSE "$dir/"
          printf 'game_mode_switcher %s\nWindows x86_64 (MSVC)\nSource: https://github.com/gtrak/game_mode_switcher\n' \
            "${{ github.ref_name }}" > "$dir/VERSION.txt"
          sha256sum "$dir/game_mode_switcher.exe" > "$dir/sha256sums.txt"
          zip -r "$dir.zip" "$dir"
          sha256sum "$dir.zip" > "$dir.zip.sha256"

      - name: Create GitHub release
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: |
            game_mode_switcher-*.zip
            game_mode_switcher-*.zip.sha256
